# U11 Stage A, part 1: the Stage A screen (u11_a_screen.yaml) on 15Min-1Day for all 19 symbols, plus the
# pre-registered 5Min pilot (PLAN U11): 5Min x {SPY, AAPL, TLT}. Same cells, hence same hashes, as their
# u11_a_screen.yaml counterparts, so running that spec afterwards (if the pilot rule says so) skips them.
# Cells are listed longest first (5Min, 15Min, ... 1Day) so the long fits do not form the run's tail.
stage: A
name: u11_a1
defaults:
  start: 2016-01-01
  end: 2025-10-01
  feature_groups: default
  meta_train: oof
  sizer: fixed
  risk_profile: none
  overrides: {TEST: 10}
grid:
  primary.name: [wavelet_trend, sma_cross, bollinger_mr, donchian_breakout, ml_xgb]
  model.meta: [xgb, rf_ldp]
cells:
  - {symbols: SPY, timeframe: 5Min}
  - {symbols: AAPL, timeframe: 5Min}
  - {symbols: TLT, timeframe: 5Min}
  - {symbols: SPY, timeframe: 15Min}
