# U11 Stage A, xgb meta only (PLAN U11 amendment 2026-10-03): the u11_a_screen.yaml cells with model.meta = xgb,
# longest timeframe first. Same cells (hashes) as u11_a_screen.yaml; cached fits (u11_a1's) are reused.
name: u11_a2
stage: A
defaults:
  start: 2016-01-01
  end: 2025-10-01
  feature_groups: default
  meta_train: oof
  sizer: fixed
  risk_profile: none
  overrides: {TEST: 10}
grid:
  primary.name: [wavelet_trend, sma_cross, bollinger_mr, donchian_breakout, ml_xgb]
  model.meta: [xgb]
