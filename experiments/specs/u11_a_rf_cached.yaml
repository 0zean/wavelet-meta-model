# U11 Stage A: the rf_ldp cells already fitted (per-symbol WFO signals cached) when Stage A dropped rf_ldp
# (PLAN U11 amendment 2026-10-03). Recorded so every fitted cell counts as a trial (the 15 5Min pilot cells
# among them, as the pre-registration requires); no new rf_ldp fits. Generated from the signals cache.
