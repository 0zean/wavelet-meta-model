# U11 Stage B1 (PLAN U11, 2026-10-03): the 54 Stage A survivors (stage_a_survivors.csv, passed = True) x the Stage B
# meta-models. xgb is not refit (its Stage A rows are B1's xgb arm); rf_ldp_fast replaces rf_ldp (cost). Stage A's
# other settings; costliest timeframe first. Generated from stage_a_survivors.csv.
name: u11_b1
stage: B
defaults:
  start: 2016-01-01
  end: 2025-10-01
  feature_groups: default
  meta_train: oof
  sizer: fixed
  risk_profile: none
  overrides: {TEST: 10}
grid:
  model.meta: [logit_l2, rf_ldp_fast, catboost]
