[project]
name = "wavelet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dill>=0.3.0",
    "fracdiff>=0.9.0",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pyfts>=1.6",
    "pywddff>=0.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "statsmodels>=0.13.5",
    "vectorbt>=0.28.2",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = ["ruff>=0.15.2"]

[tool.ruff]
exclude = [".venv"]
respect-gitignore = true
line-length = 120
lint.ignore = ["F403"]
