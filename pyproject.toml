[project]
name = "wavelet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dill>=0.3.0",
    "matplotlib>=3.11.2",
    "pandas>=2.3.3",
    "pyfts>=1.6",
    "pywddff>=0.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.9.1",
    "xgboost>=3.2.0",
    "setuptools==81.0.0",
    "alpaca-py>=0.44.0",
    "python-dotenv>=1.2.3",
    "lightgbm>=4.7.0",
    "joblib>=1.4",
    "catboost>=1.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.15.2"]

[tool.ruff]
exclude = [".venv"]
respect-gitignore = true
line-length = 120
lint.ignore = ["F403"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

