# G3 — volatility-state gating of G1 (PLAN3 §3 G3, U25): G1's registered headline R₀ with a gate known at the open,
# tested paired against G1's headline (families/G1.yaml at c168961, its cells re-run in G3's batch and priced at the
# same cost at every point of the cost curve).
# Registered AFTER G1's U24 report was read. That report's vol_quintile split showed the edge in q4–q5 (q1–q3
# ≈ +0.5–0.7 bp/day at 1.0 bp). The headline gate is PLAN3's, written before that look (skip the bottom quintile); the
# user chose it over "skip the bottom three quintiles", which would be selected on the split already seen (2026-10-11).
# Choices made at registration (U25):
# - Gate (primaries/region.py `gate`): per instrument, flat on a session whose previous-session σ of 5Min log returns
#   ranks below 0.2 among the 252 sessions ending with it (features.kernels.prior_rank of session_sigma: the
#   definition of G1's vol_quintile split, here per instrument rather than the instruments' mean rank). The rank needs
#   252 sessions, so the gate is open (G3 = G1) through the first year (2016).
# - Test `paired`: the Ledoit–Wolf Sharpe difference vs G1's headline on the same days, one-sided, excess returns, both
#   at a 1.0 bp round trip (as G1). Floors: net excess return ≥ 0.9 × G1's on the same days (PLAN3); gross edge ≥ 2 ×
#   the cost (PLAN3 §4.4).
# - Coherence over the variants (§17): the share with the headline's sign ≥ 2/3 and the median variant's floors.
# - The reference pins G1's registered sha (c168961): a run refuses G1 registered at any other sha (U25 review).
# - Variants (3; PLAN3 lists 5): the bottom two quintiles; size ∝ the vol quintile (⌈5 · rank⌉ / 5); the revealed-gamma
#   gate (flat when the lag-1 autocorrelation of 5Min returns over the previous 5 sessions is negative). Dropped
#   (the user, 2026-10-11): "band dollar width < 2 × the round-trip cost" can never fire on these bars (the 10:00 band's
#   minimum over 2016–2025 is 5.4 bp on SPY and 8.0 bp on QQQ, vs 2 bp); "VIX at the open < 13" needs VIX plumbed into
#   the region primary (U26's state work).
# - Power (families.power.mde_delta_sharpe): n 2,400 days; ρ(G3, G1) 0.962 = √(the share of the instruments' intraday
#   variance on the sessions the gate keeps: SPY 0.932, QQQ 0.919, from the bars alone); reference Sharpe 0.95 (PLAN3
#   §3 G1's expected); Holm over 4 families: MDE Δ Sharpe 0.28. Expected +0.2 (PLAN3 §3 G3: +0.1 to +0.3). Below the
#   MDE: registered as a DIAGNOSTIC, as G1.
id: G3
registered: {sha: 'e66c3143ce0532885cdc0d3da92b6b2dbd93b0df', date: '2026-10-11'}
mechanism: >-
  Hedging flows and order imbalances scale with volatility; in calm sessions the noise band is narrow and the
  continuation G1 trades is below its cost. Realized volatility is persistent (parameter rank is not: the RMV repo),
  so a state filter known at the open — skip the sessions after the calmest fifth of the past year — can raise G1's
  Sharpe ratio while giving up little of its return.
instruments: [SPY, QQQ]
timeframe: 5Min
weighting: equal
headline:
  primary:
    name: region_trend
    params:
      estimators: [band, rmedv, sgv]
      n_list: [6, 9, 12, 18, 24]
      theta_list: [0.75, 1.0, 1.5, 2.0]
      vm_list: [1.0, 1.25, 1.5]
      band_lookback: 14
      norm_sessions: 21
      sg_degree: 1
      cadence: 30
      first: "10:00"
      exit: close
      band_stop: vwap
      vel_stop: null
      vel_mode: sar
      gate: {kind: vol_quantile, below: 0.2, sessions: 252}
  cost_model: quotes
  risk_profile: loss_gate
  overrides: {INIT_CASH: 30000, FILL_AUCTION: print, COST_TABLE: asof, CASH_YIELD: tbill, SESSION_CLOCK: calendar,
              STRESS_MULT: 1.0}
reference: {family: G1, variant: headline, sha: 'c1689612eef33fd87f87ec99bc793cd3038bbc7b'}
variants:
  - {label: gate_q2, primary.params.gate: {kind: vol_quantile, below: 0.4, sessions: 252}}
  - {label: size_quintile, primary.params.gate: {kind: vol_size, sessions: 252}}
  - {label: gamma_gate, primary.params.gate: {kind: gamma, min: 0.0, sessions: 5}}
state_splits: [vol_quintile, year]
response: [sharpe, ret_ann, vol_ann, max_dd, skew, worst_day, exposure, crisis_return]
sample_splits:
  - {label: "2016_2019", start: 2016-01-04, end: 2020-01-01}
  - {label: "2020_2025", start: 2020-01-01, end: 2025-10-01}
benchmark: constant_mix_ew
floors: {min_net_ret_vs_reference: 0.9, min_edge_to_cost: 2.0}
test: {kind: paired, sided: one, at_cost: 1.0, alpha: 0.05, block_days: 21, n_boot: 5000, coherence_share: 0.667,
       coherence: variants, seed: 0}
power: {n_days: 2400, rho: 0.962, sharpe_ref: 0.95, families: 4, mde_delta_sharpe: 0.28, expected_delta_sharpe: 0.2,
        diagnostic: true}
account: {kind: margin, equity: 30000}
TRIAL_BUDGET: 6
