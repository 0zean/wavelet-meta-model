# F7 — overnight gap reversal in the first hour (PLAN2 §F7, U18). Headline as PLAN2: index leg only (SPY, QQQ, IWM),
# on days without a scheduled macro release fade an opening gap larger than 1 σ of earlier gaps: enter at the 09:35
# bar's open (decided at the 09:30 bar's close, skipping the opening auction), exit at the 10:30 bar's open.
# Choices made at registration (U18):
# - Size: the rule's magnitude m = min(1, |gap / σ_overnight| / 2) (U16 as built), within each instrument; across
#   instruments the equal-risk pooling does PLAN2's "size by 1/σ".
# - VOL_PROFILE none: gap_sigma is in units of σ of earlier gaps and does not read the time-of-day profile, so `tod`
#   would change nothing but the warm-up.
# - risk_profile none (see F5.yaml); benchmark buy_and_hold_er; floors the PLAN2 defaults (2 %/yr, 3 × cost).
# - Variants (PLAN2 axes): gap threshold 0.5σ / 1.5σ; exit 10:00; exit when the gap is filled (hysteresis β = 0,
#   else 10:30). The news-continuation leg (follow on FOMC / CPI / NFP days) is a different claim and is not run;
#   the single-stock leg is a sample split (on its non-macro days; earnings days are not excluded there).
id: F7
registered: {sha: 'dd8228d0abeafdf6f2f45ed621fd5ab81279fa1b', date: '2026-10-10'}
mechanism: >-
  Large overnight gaps mix information, which persists, with liquidity-driven overnight moves and opening-auction
  imbalances, which revert; on days without scheduled news the liquidity component dominates, so part of the gap
  reverts within the first hour.
instruments: [SPY, QQQ, IWM]
timeframe: 5Min
headline:
  primary: {name: gap_fade, params: {min_gap_sigma: 1.0, exit: "10:30", follow_on_news: false}}
  cost_model: quotes
  risk_profile: none
variants:
  - {label: gap05, primary.params.min_gap_sigma: 0.5}
  - {label: gap15, primary.params.min_gap_sigma: 1.5}
  - {label: exit_1000, primary.params.exit: "10:00"}
  - {label: fill_exit, primary.params.exit: hysteresis}
state_splits: [vix_tercile, day_of_week, abs_move_tercile, prior_day_sign]
response: [sharpe, mean_per_trade_bp, hit_rate, max_dd, skew, exposure]
sample_splits:
  - {label: "2016_2019", start: 2016-01-04, end: 2020-01-01}
  - {label: "2020_2025", start: 2020-01-01, end: 2025-10-01}
  - {label: stocks, instruments: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, JPM, XOM, UNH]}
benchmark: buy_and_hold_er
floors: {min_net_ret: 0.02, min_edge_to_cost: 3.0}
test: {alpha: 0.05, block_days: 21, n_boot: 2000, coherence_share: 0.667, seed: 0}
TRIAL_BUDGET: 10
